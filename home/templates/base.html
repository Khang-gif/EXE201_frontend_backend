{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dimension Studio{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="py-3 ">
        <div class="container d-flex flex-wrap align-items-center justify-content-between">
            <a href="{% url 'home:home' %}" class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none">
                <img src="/media/logo.png" alt="Dimension Studio Logo" height="50">
            </a>
            <ul class="nav justify-content-end gap-3">
                <li class="nav-item"><a href="#how-it-works" class="nav-link px-2 link-dark">How It Works</a></li>
                <li class="nav-item"><a href="#demo" class="nav-link px-2 link-dark">Demo</a></li>
                <li class="nav-item"><a href="{% url 'home:about' %}" class="nav-link px-2 link-dark">About Us</a></li>
                <li class="nav-item"><a href="{% url 'home:contact' %}" class="btn btn-dark">More</a></li>
            </ul>
        </div>
    </header>

    <main>
        {% block content %}
        <!-- Page content will go here -->
        {% endblock %}
    </main>

    <footer class="bg-light py-4 mt-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <img src="/media/logo.png" alt="Dimension Studio" height="40" class="mb-3">
                </div>
                <div class="col-md-6">
                    <div class="d-flex justify-content-md-end gap-4">
                        <a href="{% url 'home:about' %}" class="text-dark text-decoration-none">About Us</a>
                        <a href="{% url 'home:contact' %}" class="text-dark text-decoration-none">Contact</a>
                        <a href="{% url 'home:privacy' %}" class="text-dark text-decoration-none">Privacy & Security</a>
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <div class="d-flex gap-3">
                        <a href="#" class="text-muted"><i class="fab fa-facebook"></i></a>
                        <a href="#" class="text-muted"><i class="fab fa-linkedin"></i></a>
                        <a href="#" class="text-muted"><i class="fab fa-youtube"></i></a>
                        <a href="#" class="text-muted"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
</body>
</html>
