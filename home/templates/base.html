{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dimension Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="py-3">
        <div class="container d-flex flex-wrap align-items-center justify-content-between">
            <a href="{% url 'home:home' %}" class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none">
                <img src="/media/logo.png" alt="Dimension Studio Logo" height="50">
            </a>
            <ul class="nav justify-content-end gap-3">
                <li class="nav-item"><a href="#how-it-works" class="nav-link px-2 link-dark">How It Works</a></li>
                <li class="nav-item"><a href="#demo" class="nav-link px-2 link-dark">Demo</a></li>
                <li class="nav-item"><a href="#about-us" class="nav-link px-2 link-dark">About Us</a></li>
                <li class="nav-item"><a href="#more" class="btn btn-dark">More</a></li>
            </ul>
        </div>
    </header>

    <main class="container mt-4">
        {% block content %}
        <!-- Nội dung trang sẽ nằm đây -->
        {% endblock %}
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
